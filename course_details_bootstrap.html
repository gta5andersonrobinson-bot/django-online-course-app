<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ course.title }}</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">Course: {{ course.title }}</h1>
        
        <div class="card">
            <div class="card-header bg-primary text-white">
                Lessons
            </div>
            <ul class="list-group list-group-flush">
                <!-- Loop through all related lessons -->
                {% for lesson in course.lesson_set.all %}
                    <li class="list-group-item">
                        <h4>{{ lesson.title }}</h4>
                        <p>{{ lesson.content }}</p>
                    </li>
                {% empty %}
                    <li class="list-group-item">No lessons available for this course yet.</li>
                {% endfor %}
            </ul>
        </div>
        
        <!-- Button to trigger the exam submission -->
        <div class="mt-4">
            <form action="{% url 'submit' course.id %}" method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-success">Submit Exam</button>
            </form>
        </div>
    </div>
</body>
</html>
